
name: CI

on:
	pull_request:
		branches: [master]
		types: [ready_for_review, opened, reopened, synchronize,converted_to_draft]

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
	run-frontend-checks:
		name: Lint / Build / Test (staging → master, labeled "ready for merge")
		runs-on: ubuntu-latest
		if: >-
			github.event.pull_request.draft == false

		steps:
			- name: Checkout
				uses: actions/checkout@v4

			- name: Set up Node.js
				uses: actions/setup-node@v4
				with:
					node-version: '20'

			- name: Install dependencies
				run: 
					npm ci

			- name: Run lint
				run: 
					npm run lint

			- name: Run build
				run: 
					npm run build

			- name: Run tests
				run:
					npm test

